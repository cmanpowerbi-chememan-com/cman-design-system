<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chememan Design System — App Shell Example</title>

<!-- This design system's tokens — the ONLY stylesheet this page needs.
     No CDN, no build step: the source app ships no custom webfont and no
     framework dependency, so this example doesn't either. -->
<link rel="stylesheet" href="../tokens/tokens.css" />

<style>
  /* Everything below is component CSS built ONLY from tokens.css custom
     properties, using the SAME class names documented in
     components/COMPONENTS.md and patterns/PATTERNS.md § 1 (nav shell,
     buttons, cards, status legend/cells, GL chips, budget grid). This file
     exists so jakkaritw can open it directly, with no build step, and see
     the system rendered with the real markup contract. */

  html, body { margin: 0; }
  body {
    font-family: var(--cman-font-sans);
    font-size: var(--cman-fs-base);
    line-height: var(--cman-lh-base);
    background: var(--cman-shell);
    color: var(--cman-ink);
  }

  /* Nav — components/COMPONENTS.md § Nav (on-shell tokens, no card ancestor) */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--cman-shell);
    border-bottom: 1px solid var(--cman-line-on-shell);
  }
  .nav-inner { display: flex; align-items: center; gap: 18px; height: 64px; max-width: 1200px; margin: 0 auto; padding: 0 28px; }
  .nav-logo-text { display: flex; flex-direction: column; gap: 1px; }
  .nav-logo-text .name { font-weight: var(--cman-fw-semibold); font-size: var(--cman-fs-xl); letter-spacing: var(--cman-ls-tight-3); color: var(--cman-ink-on-shell); }
  .nav-logo-text .sub { font-size: var(--cman-fs-xs2); color: var(--cman-ink-on-shell-2); font-weight: var(--cman-fw-medium); letter-spacing: var(--cman-ls-wider); text-transform: uppercase; }
  .icon-btn { margin-left: auto; width: 36px; height: 36px; border-radius: var(--cman-r-base); border: 1px solid var(--cman-line); background: var(--cman-surface); cursor: pointer; font-size: var(--cman-fs-xl2); }

  /* Page shell — patterns/PATTERNS.md § 1 */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px 60px; }
  .page-head { padding: 32px 0 22px; display: flex; flex-direction: column; gap: 16px; }
  .page-title {
    font-family: var(--cman-font-serif); font-size: var(--cman-fs-display); line-height: var(--cman-lh-tight);
    letter-spacing: var(--cman-ls-tight); font-weight: var(--cman-fw-regular); color: var(--cman-accent-on-shell); margin: 0;
  }
  .page-title em { font-style: italic; color: var(--cman-ink-on-shell); }

  /* Card + buttons — components/COMPONENTS.md */
  .card { background: var(--cman-surface); border: 1px solid var(--cman-line); border-radius: var(--cman-r-base); padding: 20px 24px; margin-bottom: 20px; }
  .card h2 { font-family: var(--cman-font-serif); font-size: var(--cman-fs-3xl); font-weight: var(--cman-fw-medium); margin: 0 0 14px; color: var(--cman-ink); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: var(--cman-r-base);
    font-size: var(--cman-fs-md2); font-weight: var(--cman-fw-semibold); letter-spacing: var(--cman-ls-tight-3);
    border: 1px solid var(--cman-line); background: var(--cman-surface); color: var(--cman-ink); cursor: pointer;
  }
  .btn:hover { border-color: var(--cman-ink); background: var(--cman-surface-inset); }
  .btn-export { background: var(--cman-green); color: #fff; border-color: var(--cman-green); }

  /* Status legend + cells */
  .legend { display: flex; align-items: center; gap: 20px; font-size: var(--cman-fs-2xl); color: var(--cman-ink-3); font-family: var(--cman-font-mono); letter-spacing: var(--cman-ls-wide); margin-bottom: 14px; }
  .legend-item { display: inline-flex; align-items: center; gap: 8px; }
  .legend-dot { width: 11px; height: 11px; border-radius: var(--cman-r-circle); }
  .legend-dot.sap { background: var(--cman-status-sap); }
  .legend-dot.approved { background: var(--cman-status-approved); }
  .legend-dot.pending { background: var(--cman-status-pending); }

  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--cman-fs-md); }
  thead th { text-align: left; padding: 8px 10px; font-size: var(--cman-fs-xs2); font-weight: var(--cman-fw-semibold); text-transform: uppercase; letter-spacing: var(--cman-ls-wider); color: var(--cman-ink-2); background: var(--cman-surface-inset); border-bottom: 1px solid var(--cman-line); }
  td { padding: 7px 10px; border-bottom: 1px solid var(--cman-line-2); }
  .status-cell { font-family: var(--cman-font-mono); font-size: var(--cman-fs-xs2); font-weight: var(--cman-fw-semibold); letter-spacing: var(--cman-ls-wider); text-transform: uppercase; }
  .status-cell.sap { color: var(--cman-status-sap); }
  .status-cell.approved { color: var(--cman-status-approved); }
  .status-cell.pending { color: var(--cman-status-pending); }

  .gl-chip { --chip-bg: #888; --chip-fg: #fff; background: var(--chip-bg); color: var(--chip-fg); padding: 5px 11px; border-radius: var(--cman-r-xs); border: 1px solid rgba(255,255,255,.25); font-weight: var(--cman-fw-bold); font-size: var(--cman-fs-sm2); display: inline-block; }
  .gl-chip.travel { --chip-bg: #f2b705; --chip-fg: #3a2e00; }
  .gl-chip.training { --chip-bg: #845ef7; }
</style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <div class="nav-logo-text">
        <span class="name">Chememan</span>
        <span class="sub">Budget Management</span>
      </div>
      <button class="icon-btn" aria-label="Toggle theme">&#9789;</button>
    </div>
  </nav>

  <div class="wrap">
    <div class="page-head">
      <h1 class="page-title">OPEX <em>Management.</em></h1>
    </div>

    <div class="card">
      <h2>Actions</h2>
      <div class="btn-row">
        <button class="btn">Cancel</button>
        <button class="btn btn-export">Export</button>
        <button class="btn">Reset columns</button>
      </div>
    </div>

    <div class="card">
      <h2>Status reference</h2>
      <div class="legend">
        <span class="legend-item"><span class="legend-dot sap"></span>SAP</span>
        <span class="legend-item"><span class="legend-dot approved"></span>Approved</span>
        <span class="legend-item"><span class="legend-dot pending"></span>Pending</span>
      </div>
      <table>
        <thead>
          <tr><th>GL Code</th><th>GL Group</th><th>Status</th><th style="text-align:right;">Amount</th></tr>
        </thead>
        <tbody>
          <tr>
            <!-- Sample rows only. GL codes and amounts here are INVENTED
                 placeholders — never paste real chart-of-accounts codes or
                 real SAP figures into a design-system demo, this repo is
                 shared. -->
            <td>6000000001</td>
            <td><span class="gl-chip travel">Travel</span></td>
            <td class="status-cell sap">SAP</td>
            <td style="text-align:right;">1,000,000</td>
          </tr>
          <tr>
            <td>6000000002</td>
            <td><span class="gl-chip training">Training</span></td>
            <td class="status-cell approved">Approved</td>
            <td style="text-align:right;">350,000</td>
          </tr>
          <tr>
            <td>6000000003</td>
            <td>Office Supplies</td>
            <td class="status-cell pending">Pending</td>
            <td style="text-align:right;">90,000</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
